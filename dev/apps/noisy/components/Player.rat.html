<script>
  // <Player />: what plays and its controls, a column wide, a row narrow (player.js)

  import player from './../player.js';

  let { $duration, $error, $index, $playing, $queue, $time } = player;

  const $track = $queue[$index] ?? null;
  const clock = seconds => `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, '0')}`;
</script>

<aside class='player' class:idle={!$track}>
  @if ($track)
    <Cover id={$track.cover} />
    <div class='now'>
      <span class='title'>{$track.title}</span>
      <span class='artist'>{$track.artist}</span>
    </div>
  @else
    <span class='title'>Player</span>

  <div class='controls'>
    <btn-icon icon='skip-previous' label|onclick='previous' />
    <btn-icon icon={$playing ? 'pause' : 'play'} label={$playing ? 'Pause' : 'Play'} onclick='toggle-play' />
    <btn-icon icon='skip-next' label|onclick='next' />
  </div>

  @if ($track): <input class='seek' type='range' min='0' max={$duration || 0} step='1' value={$time} oninput={event => player.seek(Number(event.target.value))} aria-label='Position' />
  @if ($track): <span class='time'>{clock($time)} / {clock($duration)}</span>
  @if ($error): <span class='error'>{$error.message}</span>
</aside>

<style>
  .player {
    align-items    : center;
    display        : flex;
    flex-direction : column;
    grid-area      : player;
    overflow       : hidden;
  
    .cover    { inline-size: calc(var(--noisy-rail) * 1.2); }
    .now      { display: flex; flex: 1; flex-flow: column; min-block-size: 0; overflow: hidden; writing-mode: vertical-rl; }      
    .title    { font-weight: 800; }
    .artist   { opacity: 0.7; }
    .controls { display: flex; flex-direction: column; }
    .seek     { display: none; }
    .time     { font-size: 0.7rem; opacity: 0.6; }
    .error    { color: var(--color-error, red); font-size: 0.75rem; }
  }
  
  .player.idle .title { flex: 1; writing-mode: vertical-rl; }
</style>
