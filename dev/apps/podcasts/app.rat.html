<script>
  import { state } from './state.js';

  import library from './library.js';
  import player  from './player.js';
  import './settings.rat.js';

  import EpisodeDetailView  from './views/EpisodeDetailView.rat.html';
  import ExplorePodcastView from './views/ExplorePodcastView.rat.html';
  import PodcastDetailView  from './views/PodcastDetailView.rat.html';

  import { hint }  from '../.shared/install.js';
  import { toast } from '../.shared/toast.js';

  let { $busy, $dialog } = state;

  RAT.app.on('error', toast.error);

  // the splash stays until the progress is read, the lists read the database themselves
  RAT.app.hold <| library.load();
  hint('Podcasts');

  async function refreshAll () {
    if (!(await RAT.app.database.podcasts.keys()).length) { $dialog = 'add'; return; }
    $busy = 'Refreshing …';
    try {
      const results = await library.refreshAll((count, total) => { $busy = `Refreshing ${count}/${total} …`; });
      const added   = results.reduce((sum, result) => sum + (result.added || 0), 0);
      const failed  = results.filter(result => result.error).length;
      toast(`${added} new episode(s), ${failed} feed(s) failed`, { type: failed ? 'error' : 'success' });
    }
    finally { $busy = ''; }
  }

  // markup and the hotkeys of config.rat.js fire these by name
  RAT.app.commands.assign({
    'add-podcast'  : () => { $dialog = 'add'; },
    'close-dialog' : () => { $dialog = null; },
    'refresh-all'  : refreshAll,
    'skip-back'    : () => player.skip(-15),
    'skip-forward' : () => player.skip(30),
    'toggle-play'  : () => { if (player.episode.value) player.toggle(); },
  });

  // a detail keeps the item of the list it was opened from
  const DOCK = [
    { icon: 'episodes', label: 'Episodes', match: ['/episode'],                to: '/' },
    { icon: 'grid',     label: 'Podcasts', match: ['/podcast'],                to: '/podcasts' },
    { icon: 'bookmark', label: 'Later',                                        to: '/saved' },
    { icon: 'explore',  label: 'Explore',  match: ['/explore-podcast'],        to: '/explore' },
    { icon: 'settings', label: 'Settings', onclick: () => RAT.app.toggle('config') },
  ];
</script>

<rat-view name='latest' route='/'><LatestView /></rat-view>
<rat-view name|route='podcasts'><PodcastsView /></rat-view>
<rat-view name|route='saved'><SavedView /></rat-view>
<rat-view name|route='explore'><ExploreView /></rat-view>

<rat-view name='episode' route='/episode/:id' component={EpisodeDetailView} transition='slide' />
<rat-view name='podcast' route='/podcast/:id' component={PodcastDetailView} transition='slide' />
<rat-view name='explore-podcast' route='/explore-podcast/:id' component={ExplorePodcastView} transition='slide' />

@if ($dialog === 'add'): <AddPodcastDialog />

<rat-area name='dock' dock='bottom' overlay='never' open>
  <Player />
  <Dock items={DOCK} />
</rat-area>

<rat-area name='config' dock='end'>
  <Settings name='Podcasts'><Preferences /></Settings>
</rat-area>
