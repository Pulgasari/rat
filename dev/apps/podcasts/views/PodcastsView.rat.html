<script>
  // <PodcastsView />: the subscriptions, by date or by name, as a list or a grid

  import { state }        from './../state.js';
  import { sortPodcasts } from './../methods.js';

  const podcasts = RAT.app.database.podcasts.$items;

  let { $dialog } = state;

  let $sorting!  = 'newest';
  let $viewmode! = 'list';

  const $podcasts = sortPodcasts(podcasts.toArray(), $sorting);

  const empty = { hint: "Paste a podcast's RSS feed URL to subscribe.", icon: 'rss', title: 'No subscriptions yet' };
</script>

<ViewHeader title='podcasts'>
  <Picker look='segments' options={[['newest', 'newest'], ['alpha', 'a–z']]} value={$sorting} onchange={value => $sorting = value} />
  <Picker look='segments' options={[['list', 'list'], ['grid', 'grid']]} value={$viewmode} onchange={value => $viewmode = value} />
  <btn-icon icon='add' label='add' onclick={() => $dialog = 'add'} />
</ViewHeader>

<main>
  <PodcastsIndex podcasts={$podcasts} viewmode={$viewmode} empty={empty} />
</main>
