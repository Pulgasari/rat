<script>
  // <Player />: the docked player bar — artwork/meta, transport, scrubber and speed/done/close

  import fmt     from './../../.shared/fmt.js';
  import library from './../library.js';
  import player  from './../player.js';

  const podcasts = RAT.app.database.podcasts.$items;

  const $episode  = player.episode.value;
  const $podcast  = $episode && podcasts.find(podcast => podcast.id === $episode.podcastId);
  const $duration = player.duration.value || $episode?.duration || 0;
  const $time     = player.time.value;
  const $done     = $episode && library.stateOf($episode.id).done;
</script>

@if ($episode)
  <div.player>
    <div.meta>
      <Artwork src={$episode.image || $podcast?.image} />
      <div.info>
        <div.title title={$episode.title}>{$episode.title}</div.title>
        <div.podcast>{$podcast?.title || ''}</div.podcast>
      </div.info>
    </div.meta>

    <div.controls>
      <btn-icon icon='back-15' label='Back 15s' onclick={() => player.skip(-15)} />
      <btn-icon.play
        icon={player.waiting.value ? 'loading' : player.playing.value ? 'pause' : 'play'}
        title={player.playing.value ? 'Pause' : 'Play'}
        onclick={player.toggle}
      />
      <btn-icon icon='ahead-30' label='Forward 30s' onclick={() => player.skip(30)} />
    </div.controls>

    <div.scrub>
      <span.time>{fmt.duration($time)}</span>
      <input.range type='range' min='0' step='1'
        max={Math.max($duration, 1)}
        value={Math.min($time, $duration || $time)}
        oninput={event => player.seek(Number(event.target.value))}
      />
      <span.time>{$duration ? '-' + fmt.duration($duration - $time) : ''}</span>
    </div.scrub>

    <div.right>
      <button.rate title='Playback speed' onclick={player.cycleRate}>{player.rate.value}</button.rate>
      <btn-icon
        icon={$done ? 'played' : 'unplayed'}
        label='Mark as done'
        aria-pressed={$done}
        onclick={() => library.toggleDone($episode.id)}
      />
      <btn-icon icon='close' label='close player' onclick={player.close} />
    </div.right>
  </div.player>
