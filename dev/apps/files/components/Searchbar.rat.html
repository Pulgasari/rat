<script>
  // <Searchbar placeholder='…' value={text} onsearch={query => …} />: the search field and the tasks beside it

  import { openTasks } from '../state.rat.js';

  import { $busy, $queue } from '../modules/tasks.rat.js';

  const $count = $queue.length;
  const $label = $count ? `${$count} tasks` : 'tasks';

  const search = event => props.onsearch?.(event.detail.query);
</script>

<div.searchbar>
  <input-search placeholder={props.placeholder} value={props.value ?? ''} onsearch={search} />
  <button.tasks-button type='button' class:busy={$busy} aria-label={$label} title={$label} onclick={openTasks}>
    <svg-icon icon={$busy ? 'pending' : 'tasks'} />
    @if ($count): <span.badge>{$count}</span.badge>
  </button.tasks-button>
</div.searchbar>
