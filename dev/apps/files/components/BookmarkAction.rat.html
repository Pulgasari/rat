<script>
  // <BookmarkAction path={['a', 'b']} />: bookmarks the folder at path, or takes its bookmark away

  import { isBookmarked, toggleBookmark } from '../modules/places.rat.js';

  const { $path } = props;

  const $marked = isBookmarked($path);
</script>

<Action icon={$marked ? 'bookmark-remove' : 'bookmark-add'} label={$marked ? 'remove bookmark' : 'bookmark'} onclick={() => toggleBookmark($path, $path.name)} />
