<script>
  // <Menu />: the views, what is coming back, the settings

  const MENU = [
    { icon: 'dashboard', label: 'Dashboard', route: '/'        },
    { icon: 'folder',           label: 'Library',   route: '/library' },
    { icon: 'send',             label: 'Send',      route: '/sync'    },
  ];

  // the tools the app had before, coming back one by one
  const SOON = [
    { icon: 'image',    label: 'Image editor' },
    { icon: 'file-edit', label: 'Text editor'  },
  ];

  const { $path: $route } = RAT.app.router;

  // an overlaid menu goes once a view is picked
  function go (route) {
    RAT.app.router.go(route);
    const menu = RAT.app.area('menu');
    if (menu?.isOverlay) menu.hide();
  }
</script>

<nav.menu>
  <Brand name='Files' icon='./app.svg' />
  @for (item of MENU)
    <button type='button' aria-current={$route === item.route ? 'page' : null} onclick={() => go(item.route)}><svg-icon icon={item.icon} /> {item.label}</button>
  <hr />
  @for (item of SOON): <button type='button' disabled><svg-icon icon={item.icon} /> {item.label} <small>soon</small></button>
  <hr />
  <button type='button' onclick={() => RAT.app.toggle('config', true)}><svg-icon icon='settings' /> Settings</button>
</nav.menu>
