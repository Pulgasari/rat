<script>
  // <Context />: the bottom area. the tasks, the servers, the selected entry, the open file, the folder on screen,
  // or the granted folder as a whole

  import { $file, $selected, $sheet, rootHandle } from '../state.rat.js';

  const { $path: $route } = RAT.app.router;
</script>

@if ($sheet === 'tasks')
  <h2>Tasks</h2>
  <TaskList />
@else if ($sheet === 'remotes')
  <h2>Remote</h2>
  <RemoteManager />
@else if ($selected)
  <EntryDetails entry={$selected} />
@else if ($route === '/preview' && $file)
  <FileDetails />
@else if ($route === '/library' && rootHandle())
  <FolderDetails />
@else
  <RootDetails />
