<script>
  // <Thumb entry={entry} at={path} from={source} />: an image's thumbnail once it is on screen, the icon of its kind
  // until then. from is the entry's source, null for the granted folder

  import { untrack } from '@rat/signals';
  import { Path }    from '@rat/types/Path';

  import { iconOf, isImage, rootOfSource } from '../state.rat.js';

  import { readFile } from '../modules/fs.js';
  import { $folder }  from '../modules/root.rat.js';

  const entry  = props.entry;
  const at     = props.at ?? Path.root;
  const from   = props.from ?? null;
  const thumbs = RAT.app.thumbnails;
  const id     = isImage(entry) ? idOf(entry) : null;

  let $url = id ? thumbs.peekFile(id) : null;

  // the source, the path and what changes with the file's content
  function idOf ({ lastModified, name, size }) {
    const source = from ?? untrack(() => $folder)?.id;
    return `${source}/${at}/${name}:${size}:${lastModified}`;
  }

  // asked for when it scrolls near the screen, once
  function watch (element) {
    if (!id || $url) return;
    let alive = true;
    const observer = new IntersectionObserver(([hit]) => {
      if (!hit.isIntersecting) return;
      observer.disconnect();
      thumbs.requestFile(id, () => readFile(rootOfSource(from), at, entry.name)).then(made => { if (alive && made) $url = made; });
    }, { rootMargin: '200px' });
    observer.observe(element);
    return () => { alive = false; observer.disconnect(); };
  }
</script>

<span.thumb @watch>
  @if ($url)
    <img src={$url} alt='' loading='lazy' />
  @else
    <svg-icon icon={iconOf(entry, from ? null : props.at)} />
</span.thumb>
