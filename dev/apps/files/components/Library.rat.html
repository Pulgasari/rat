<script>
  // <Library />: the folder in tabs: crumbs, filter, list or grid, a new folder

  import { filter, folderName, goTo, loading, newFolder, path, rootHandle, settings, visible } from '../state.js';

  const $ready     = Boolean(rootHandle());
  const $path      = path.value;
  const $viewmode  = settings.viewmode.value;
  const $tabsTop   = settings.tabbar.value === 'top';
  const $searchTop = settings.searchbar.value === 'top';

  const up     = () => $path.length ? goTo($path.slice(0, -1)) : RAT.app.router.go('/');
  const toggle = () => settings.viewmode.value = $viewmode === 'grid' ? 'list' : 'grid';
  const crumb  = event => goTo(event.detail.path.split('/').filter(Boolean));
</script>

@if (!$ready)
  <Bar title='Library' />
  <div.scroll><Welcome /></div.scroll>
@else
  <Bar title={$path.at(-1) ?? folderName()} back={up}>
    <btn-icon icon={$viewmode === 'grid' ? 'lucide:list' : 'lucide:layout-grid'} label={$viewmode === 'grid' ? 'show as list' : 'show as grid'} onclick={toggle} />
  </Bar>

  @if ($tabsTop): <Tabs />
  @if ($searchTop): <Searchbar placeholder='Filter this folder' value={filter.value} onsearch={text => filter.value = text} />

  <nav-crumbs root={folderName()} path={'/' + $path.join('/')} on:nav-crumbs={crumb} />

  <div.pane>
    <div.listing>
      @if (loading.value)
        <svg-icon icon='lucide:loader' />
      @else if (visible.value.length)
        <data-index viewmode={$viewmode} item-size='128px' item-size-min='80px' item-size-max='320px'>
          @for (entry of visible.value): <Entry entry={entry} />
        </data-index>
      @else
        <p.empty>{filter.value ? 'nothing matches the filter' : 'this folder is empty'}</p.empty>
    </div.listing>
    <button.fab type='button' aria-label='new folder' title='new folder' onclick={newFolder}><svg-icon icon='lucide:folder-plus' /></button.fab>
  </div.pane>

  <PasteBar />

  @if (!$searchTop): <Searchbar placeholder='Filter this folder' value={filter.value} onsearch={text => filter.value = text} />
  @if (!$tabsTop): <Tabs />
