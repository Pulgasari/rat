<script>
  // <Tabs />: the folders open side by side in the library

  import { $tab, $tabs, closeTab, openTab, switchTab, tabName } from '../state.rat.js';
</script>

<div-x.tabs role='tablist' scrollable>
  @for (tab of $tabs)
    <div.tab class:active={tab === $tab}>
      <button type='button' role='tab' aria-selected={tab === $tab} onclick={() => switchTab(tab)}>{tabName(tab)}</button>
      @if ($tabs.length > 1): <btn-icon icon='close' label={'close ' + tabName(tab)} onclick={() => closeTab(tab)} />
    </div.tab>
  <btn-icon icon='add' label='new tab' onclick={() => openTab()} />
</div-x.tabs>
