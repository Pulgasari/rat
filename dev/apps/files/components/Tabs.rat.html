<script>
  // <Tabs />: the folders open side by side in the library

  import { closeTab, openTab, switchTab, tabIndex, tabName, tabs } from '../state.js';

  const $tabs  = tabs.value;
  const $index = tabIndex.value;
</script>

<div-x.tabs role='tablist' scrollable>
  @for (tab of $tabs)
    <div class={$tabs.indexOf(tab) === $index ? 'tab active' : 'tab'}>
      <button type='button' role='tab' aria-selected={String($tabs.indexOf(tab) === $index)} onclick={() => switchTab($tabs.indexOf(tab))}>{tabName(tab)}</button>
      @if ($tabs.length > 1): <btn-icon icon='lucide:x' label={'close ' + tabName(tab)} onclick={() => closeTab($tabs.indexOf(tab))} />
    </div>
  <btn-icon icon='lucide:plus' label='new tab' onclick={() => openTab()} />
</div-x.tabs>
