<script>
  // <Preview />: one file, an image inline, the rest as its icon. its details are in the context area

  import { effect } from '@rat/signals';

  import { $file as $entry, $selected, $size, iconOf, isImage, rootOfSource } from '../state.rat.js';

  import { readFile } from '../../.shared/fs.js';

  let $src = null;

  // the image off disk; the cleanup drops a late answer and revokes the object url
  function show (entry) {
    let url   = null;
    let alive = true;

    readFile(rootOfSource(entry.source), entry.path, entry.name).then(blob => {
      if (!alive) return;
      url  = URL.createObjectURL(blob);
      $src = url;
    });

    return () => {
      alive = false;
      if (url) URL.revokeObjectURL(url);
    };
  }

  effect(() => {
    $size = null;
    $src  = null;
    if ($entry && isImage($entry)) return show($entry);
  });

  const loaded = event => $size = { height: event.target.naturalHeight, width: event.target.naturalWidth };

  function info () {
    $selected = null;
    RAT.app.toggle('context');
  }
</script>

@if (!$entry)
  <Bar title='Preview' back={() => history.back()} />
  <p.empty>no file open</p.empty>
@else
  <Bar title={$entry.name} back={() => history.back()}>
    <btn-icon icon='info' label='details' onclick={info} />
  </Bar>
  <div.stage>
    @if (isImage($entry))
      @if ($src): <img src={$src} alt={$entry.name} onload={loaded} />
    @else
      <svg-icon icon={iconOf($entry)} />
  </div.stage>
