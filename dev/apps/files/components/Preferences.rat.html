<script>
  // <Preferences />: the app's own settings and its folder, above the shared ones in <Settings>

  import { $settings, chooseFolder, closeFolder } from '../state.rat.js';

  import { $folder } from '../modules/root.rat.js';

  const CHOICES = {
    open      : { label: 'Open with',  values: { auto: 'auto', single: 'a tap', double: 'a double click' } },
    searchbar : { label: 'Search bar', values: { bottom: 'bottom', top: 'top' } },
    tabbar    : { label: 'Tabs',       values: { bottom: 'bottom', top: 'top' } },
  };

  const PATTERNS = { 'pattern-bg': 'Background', 'pattern-tile': 'Tiles' };

  const change = name => event => $settings[name] = event.target.value;
</script>

<section>
  <h3>files</h3>
  @for ([name, { label, values }] of Object.entries(CHOICES))
    <label>
      <span>{label}</span>
      <input-value look='segments' value={$settings[name]} onchange={change(name)}>
        @for ([value, text] of Object.entries(values)): <input-option value={value}>{text}</input-option>
      </input-value>
    </label>
  @for ([name, label] of Object.entries(PATTERNS))
    <label>
      <span>{label}</span>
      <input-pattern opacity value={$settings[name]} onchange={change(name)} />
    </label>
</section>

<section>
  <h3>folder</h3>
  @if ($folder)
    <p.folder><svg-icon icon='folder-open' /> {$folder.name}</p.folder>
    <div-x.actions>
      <Action icon='folder-sync' label='change' onclick={chooseFolder} />
      <Action icon='close' label='close' onclick={closeFolder} />
    </div-x.actions>
  @else
    <Action icon='folder-add' label='Open a folder' onclick={chooseFolder} />
</section>
