<script>
  // <FileRow entry={entry} />: a file of the index (it carries its path), on the dashboard

  import fmt from '../../.shared/fmt.js';

  import { about, open } from '../state.rat.js';

  const entry = props.entry;
  const note  = `/${entry.path} · ${fmt.bytes(entry.size)}`;
</script>

<li.row>
  <button.entry type='button' onclick={() => open(entry)}>
    <Thumb entry={entry} at={entry.path} />
    <span.text>
      <span.name>{entry.name}</span.name>
      <small>{note}</small>
    </span.text>
  </button.entry>
  <btn-icon icon='lucide:ellipsis-vertical' label='more' onclick={() => about(entry)} />
</li.row>
