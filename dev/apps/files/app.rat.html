<script>
  import { $sheet } from './state.rat.js';

  import { load }        from './modules/root.rat.js';
  import { start, stop } from './modules/sync.rat.js';

  import { hint }  from '../.shared/install.js';
  import { toast } from '../.shared/toast.js';

  // what fails in an action ends here, the actions catch nothing themselves
  RAT.app.on('error', toast.error);

  // the splash stays until the folder is known
  RAT.app.hold <| load();
  hint('Files');

  // discovery runs while the send view is on screen, it costs battery
  let sending = false;
  RAT.app.router.on('change', ({ path }) => {
    if (path === '/sync' && !sending) start();
    if (path !== '/sync' &&  sending) stop();
    sending = path === '/sync';
  });

  // the context area forgets the tasks when it closes
  const ontoggle = event => { if (!event.detail?.open) $sheet = null; };
</script>

<rat-area name='menu' dock='start'><Menu /></rat-area>

<rat-view name='dashboard' route='/'><Dashboard /></rat-view>
<rat-view name|route='library'><Library /></rat-view>
<rat-view name|route='preview' transition='slide'><Preview /></rat-view>
<rat-view name|route='sync'><Sync /></rat-view>

<rat-area name='context' dock='bottom' peek ontoggle={ontoggle}>
  <div.context><Context /></div.context>
</rat-area>

<rat-area name='config' dock='end'>
  <Settings name='Files'>
    <Preferences />
  </Settings>
</rat-area>
