<script>
  // new URL('../../packages/types/README.md', import.meta.url).href

  import { autoloader } from '@aufbau/elements';
  import dom            from '@domina/dom';
  import { rat, ratjs } from '@rat/syntax/targets/hljs.js';

  autoloader();

  // the languages of rat as modules of this app, not a specifier <write-code> imports by its name: a build has no import map
  customElements.whenDefined('write-code').then(WriteCode => WriteCode.registerLanguage('rat', rat).registerLanguage('ratjs', ratjs));
  
  const TOPICS = ['welcome', 'config', 'components', 'comptime', 'directives', 'dom', 'htx', 'import', 'modules', 'operators', 'persistence', 'schemas', 'signals', 'styles', 'types'];
  const PAGES2 = TOPICS.map :: item => ({ name: item, title: item });
  const $page  = RAT.app.router.$path.value.replace(/^\//, '') || 'welcome'; // PAGES2[0].name;
  const $src   = PAGES2.find(page => page.name === $page)?.path ?? new URL(`./content/${$page}.md`, import.meta.url).href;

  // the pages before and after the one on screen, in the order of the menu
  const $at   = PAGES2.findIndex(page => page.name === $page);
  const $prev = PAGES2[$at - 1] ?? null;
  const $next = PAGES2[$at + 1] ?? null;

  // a fenced code block becomes a <write-code> of aufbau, once the page is rendered
  function codeBlocks (root) {
    const ctx = root.currentTarget;
    for (const code of ctx.querySelectorAll('pre > code')) {
      const lang  = code.className.match(/language-(\S+)/)?.[1] ?? 'plaintext';
      const block = dom.createElement('write-code', { lang, actions: 'copy' }, code.textContent);
      code.parentElement.replaceWith(block);
    }
  }

  // a narrow screen has the menu as a drawer
  const menu   = () => RAT.app.area('menu');
  const picked = () => { if (menu()?.isOverlay) menu().hide(); };
  const wide   = matchMedia('(min-width: 48rem)').matches;
</script>

@fragment pageLink (page) {
  <a href={'#/' + page.name} class:active={$page === page.name} onclick={picked}>{page.title}</a>
}

<rat-area id|name='menu' dock='start' open={wide}>
  <nav>
    <a.brand href='../../'>RAT</a>
    @for (page of PAGES2): {pageLink(page)}
    <a href='../../demos/'>Demos</a>
    <a href='https://github.com/pulgasari/rat'>GitHub</a>
  </nav>
</rat-area>

<rat-view route='/*' id|name='page'>
  <header id='bar'>
    <button aria-label='menu' onclick='rat:toggle[menu]'>☰</button>
    <!--<button aria-label|cmd:toggle='menu'>☰</button>-->
    <span>RAT docs</span>
    </header>
  
  <main>
    <output-md
      src={$src}
      on:output-md-rendered={codeBlocks}
    />
  </main>

  <footer>
    <div.prev>@if ($prev): <a href={'#/' + $prev.name} rel='prev'>← {$prev.title}</a></div.prev>
    <div>{$page}</div>
    <div.next>@if ($next): <a href={'#/' + $next.name} rel='next'>{$next.title} →</a></div.next>
  </footer>
</rat-view>

<style>
  #page footer {
    display: flex; flex-flow: row nowrap; align-items: center; justify-content: space-between;
    /*flow: flex row nowrap center space-between;*/
  }

  /* prev and next as wide as each other, the page between them stays in the middle */
  #page footer :is(.prev, .next) { flex: 1 1 0; }
  #page footer .next             { text-align: end; }
</style>
