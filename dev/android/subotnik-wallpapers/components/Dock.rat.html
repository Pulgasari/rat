<script>
  // <Dock />: the tab bar at the bottom opens a panel above it, a tab tapped again closes it. while it
  // is open the pages lie side by side: a swipe on their empty area changes the tab, the handle on
  // top sets the height (kept). below the tabs the sources

  import { effect } from '@rat/signals';

  import { $panelHeight, $tab, TABS, toggleTab } from '../state.rat.js';

  const MIN = 130;

  let $track = null;
  let $panel = null;

  const max   = () => Math.round(innerHeight * 0.78);
  const width = () => $track?.firstElementChild?.getBoundingClientRect().width ?? 0;

  // the track on the page of the tab, in px: exact at any font scale
  function place (animate) {
    if ($tab === null || !$track) return;
    $track.style.transition = animate ? 'transform 0.25s ease' : 'none';
    $track.style.transform  = `translateX(${-$tab * width()}px)`;
  }

  let last = null;
  effect(() => {
    const tab = $tab;
    $track;
    requestAnimationFrame(() => place(last !== null && tab !== null));
    last = tab;
  });

  addEventListener('resize', () => place(false));

  // ::: the height, dragged at the handle

  let resize = null;

  const resizeStart = event => {
    resize = { height: $panel.getBoundingClientRect().height, y: event.clientY };
    event.currentTarget.setPointerCapture(event.pointerId);
  };

  const resizeMove = event => {
    if (resize) $panel.style.height = `${Math.max(MIN, Math.min(max(), resize.height + resize.y - event.clientY))}px`;
  };

  function resizeEnd () {
    if (!resize) return;
    resize = null;
    $panelHeight = Math.round($panel.getBoundingClientRect().height);
    place(false);
  }

  const $height = $panelHeight && $panelHeight > MIN ? `height: ${Math.min($panelHeight, max())}px` : '';

  // ::: a horizontal swipe between the pages, on their empty area: controls and tiles keep theirs

  let swipe = null;

  function swipeStart (event) {
    if ($tab === null || event.target.closest('input, select, textarea, button, a, .tile, .tile-editor')) return;
    swipe = { base: -$tab * width(), decided: false, horizontal: false, x: event.clientX, y: event.clientY };
  }

  function swipeMove (event) {
    if (!swipe) return;
    const dx = event.clientX - swipe.x;
    const dy = event.clientY - swipe.y;
    if (!swipe.decided) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      swipe.horizontal = Math.abs(dx) > Math.abs(dy);
      swipe.decided    = true;
    }
    if (!swipe.horizontal) return;
    const end = -(TABS.length - 1) * width();
    let x = swipe.base + dx;
    if (x > 0) x *= 0.3;                       // a rubber band past the ends
    else if (x < end) x = end + (x - end) * 0.3;
    $track.style.transition = 'none';
    $track.style.transform  = `translateX(${x}px)`;
  }

  function swipeEnd (event) {
    if (!swipe) return;
    const { horizontal, x } = swipe;
    swipe = null;
    if (!horizontal) return;
    const dx   = event.clientX - x;
    const page = width();
    let next = $tab;
    if (dx < -page * 0.25) next = Math.min(TABS.length - 1, $tab + 1);
    else if (dx > page * 0.25) next = Math.max(0, $tab - 1);
    if (next === $tab) place(true);
    else $tab = next;
  }
</script>

<div.dock>
  <section.tab-panel hidden={$tab === null} style={$height} ref={$panel}>
    <div.panel-handle aria-label='Höhe anpassen' onpointerdown={resizeStart} onpointermove={resizeMove} onpointerup={resizeEnd} onpointercancel={resizeEnd}><span.grip></span></div>
    <div.tab-track ref={$track} onpointerdown={swipeStart} onpointermove={swipeMove} onpointerup={swipeEnd} onpointercancel={swipeEnd}>
      <div.tab-page><ConfigPage /></div.tab-page>
      <div.tab-page><FiltersPage /></div.tab-page>
      <div.tab-page><MotionPage /></div.tab-page>
      <div.tab-page><ParallaxPage /></div.tab-page>
    </div.tab-track>
  </section.tab-panel>

  <nav.tabbar role='tablist'>
    @for (tab, index of TABS): <button.tab-btn class:active={$tab === index} role='tab' onclick={() => toggleTab(index)}>{tab[1]}</button>
  </nav.tabbar>

  <SourcesBar />
</div.dock>
