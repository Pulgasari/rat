<script>
  // <Cover book={book} class='book-cover' />: the extracted image if there is one, otherwise a titled placeholder

  import { effect } from '@rat/runtime';

  const book = this.props.book;

  let $url = null;

  effect(() => {
    if (!book.cover) return;
    const url = URL.createObjectURL(book.cover);
    $url = url;
    return () => URL.revokeObjectURL(url);
  });

  // a stable pastel from a title, for the placeholder cover
  function hueOf (text = '') {
    let hash = 0;
    for (let index = 0; index < text.length; index++) hash = (hash * 31 + text.charCodeAt(index)) >>> 0;
    return hash % 360;
  }
</script>

<div.cover class={props.class} class:has-img={!!$url} style:--hue={hueOf(book.title)} style:background-image={$url ? `url("${$url}")` : null}>
  @if (!book.cover)
    <div.cover-fallback>
      <svg-icon icon={book.kind === 'pdf' ? 'mdi:file-pdf-box' : 'mdi:book-open-page-variant-outline'} />
      <span.cover-title>{book.title}</span>
      @if (book.author): <span.cover-author>{book.author}</span>
    </div.cover-fallback>
  <span class={'kind-badge ' + book.kind}>{book.kind.toUpperCase()}</span>
</div.cover>
