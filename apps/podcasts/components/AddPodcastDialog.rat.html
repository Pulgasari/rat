<script>
  // <AddPodcastDialog />: search by name, or paste an RSS feed URL

  import { effect } from '@rat/runtime';

  import toast              from './../../.shared/toast.js';
  import library            from './../library.js';
  import { state }          from './../state.js';
  import { go, looksLikeUrl } from './../methods.js';
  import { searchPodcasts } from './../search.js';

  const DEBOUNCE = 300;

  let { $dialog } = state;

  let $query   = '';
  let $results = [];
  let $busy    = false;
  let $note    = '';

  const close = () => $dialog = null;

  // search-as-you-type: the timer waits out the typing, the controller drops a
  // request whose query has already moved on
  effect(() => {
    const text = $query.trim();
    $note = '';
    if (!text || looksLikeUrl(text)) { $results = []; return; }

    const controller = new AbortController;
    const timer      = setTimeout(async () => {
      $busy = true;
      try {
        $results = await searchPodcasts(text, { signal: controller.signal });
        if (!$results.length) $note = 'nothing found for that name';
      }
      catch (error) { if (error.name !== 'AbortError') $note = error.message; }
      finally       { if (!controller.signal.aborted) $busy = false; }
    }, DEBOUNCE);

    return () => { clearTimeout(timer); controller.abort(); };
  });

  async function add (url) {
    if (!url || $busy) return;
    $busy = true;
    try {
      const podcast = await library.subscribe(url);
      toast.success(`Subscribed to ${podcast.title}`);
      close();
      go('podcast', podcast.id);
    }
    catch (error) { toast.error(error); $note = error?.message || String(error); }
    finally       { $busy = false; }
  }

  const submit = () => { if (looksLikeUrl($query.trim())) add($query.trim()); };

  const actions = [{ label: 'cancel', onclick: close }];
</script>

<Modal class='add-podcast' headline='Add a podcast' info='Search by name, or paste an RSS feed URL.' actions={actions} onclose={close}>
  <input type='search' autofocus
    placeholder='darknet diaries — or https://example.com/feed.xml'
    bind:value={$query}
    on:keydown[enter]={submit}
  />

  @if ($note): <i.note>{$note}</i>
  @if ($busy): <Loading text='searching …' />

  @if ($results.length)
    <ul.results>
      @for (result of $results)
        <li>
          <button onclick={() => add(result.feedUrl)} disabled={$busy}>
            <Artwork src={result.image} />
            <span.meta>
              <span.title>{result.title}</span>
              <span.sub>{result.author}{result.count ? ` · ${result.count} episodes` : ''}</span>
            </span.meta>
          </button>
        </li>
    </ul.results>
</Modal>
