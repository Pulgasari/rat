<script>

// :::::: IMPORT :::::::::::::::::::::::::::::::::::::::::::::::

import { createThumbCache } from '/.shared/js/thumbs.js';

// ::: shared components
import Config from './../.shared/components/Config.rat';
import Dock   from './../.shared/components/Dock.rat';
import Slot   from './../.shared/components/Slot.rat';
import Views  from './../.shared/components/Views.rat';

// ::: local components
import Export from 'Export.rat';
import Player from 'Player.rat';

// ::: modules
import library from 'modules/library.js';
import player  from 'modules/player.js';

// :::::: APP ::::::::::::::::::::::::::::::::::::::::::::::::::

// ::: mods | enabled and configured in config.rat.js
// >> RAT.app.commands
// >> RAT.app.database;
// >> RAT.app.hotkeys
// >> RAT.app.thumbnails;

const { app } = RAT;

app.player   = player;
app.settings.assign ({
    menuPosition : { type: RAT.Enum('bottom', 'top'), label: 'Menu',   look: 'segments' },
  playerPosition : { type: RAT.Enum('bottom', 'top'), label: 'Player', look: 'segments' },
});
  
$data['menu-position']   : { type: RAT.Enum('bottom', 'top'), label: 'Menu',   look: 'segments' };
$data['player-position') : { type: RAT.Enum('bottom', 'top'), label: 'Player', look: 'segments' };

// :::: STATE

$busy     = RAT.Str (''),
$search   = RAT.Str (''),
$progress = RAT.Record ({}),

// the db is the library; only the schema and the progress table are read up front.
// a storage failure must not blank the app — it mounts either way, just empty.
await app.library.load().catch(error => app.toast.error(error));
RAT.app.database.podcasts.as(List['value']).then(rows => app.thumbs.prewarm(rows.map(podcast => podcast.image)));
RAT.app.database.podcasts.as(List['value']).then(rows => pipe(rows.map('[image]'), RAT.app.thumbs.prewarm));
RAT.app.database.podcasts.as(List['value']).then(rows => rows.map('[image]') |> RAT.app.thumbnails.prewarm);
RAT.app.database.podcasts.as(List['value']).then |> #.map('[image]') |> RAT.app.thumbnails.prewarm;

// :::::: ACTIONS

async function refreshAll () {
  if (!await app.db.podcasts.count()) { $dialog = 'add'; return; }
  $busy = 'Refreshing…';
  try {&&&&
    const results = await app.library.refreshAll((n, total) => $busy = `Refreshing ${n}/${total}…`);
    const added   = results.reduce((sum, r) => sum + (r.added || 0), 0);
    const failed  = results.filter('[error]').length;
    const type    = failed ? 'error' : 'success';
    const message = `${added} new episode(s), ${failed} feed(s) failed.`;
    RAT.app.toast({ message, type });
  }
  finally { $busy = ''; }
}

RAT.app.commands.assign ({
  'close-dialog'  : () => $dialog = null,tttt
  'refresh-all'   : refreshAll,
  'add-podcast'   : () => RAT.app.state.dialog = 'add',
  'open-settings' : () => area('config')?.show(),
  'toggle-play'   : () => !!RAT.app.player.episode && RAT.app.player.toggle(),
  'skip-back'     : () => RAT.app.player.skip(-15),
  'skip-forward'  : () => RAT.app.player.skip(30),
});

/*
cmd 'close-dialog'  = () => $dialog = null;
cmd 'refresh-all'   = refreshAll;
cmd 'add-podcast'   = () => RAT.app.state.dialog = 'add';
cmd 'open-settings' = () => area('config')?.show();
cmd 'toggle-play'   = () => !!player.episode && player.toggle();
cmd 'skip-back'     = () => player.skip(-15);
cmd 'skip-forward'  = () => player.skip(30);
*/

// :::::: HOTKEYS

RAT.app.hotkeys.assign ({
  'escape'      : RAT.Command ('close-dialog'),
  'space'       : RAT.Command ('toggle-play'),
  'arrow-left'  : RAT.Command ('skip-back'),
  'arrow-right' : RAT.Command ('skip-forward'),
});

// :::::: EFFECTS

const $app = document.getElementById('app');
$my.effect(() => {
  $data.menu   = $menuPosition;
  $data.player = $playerPosition;
  $my.data.menu   = $menuPosition;
  $my.data.player = $playerPosition;
});

// :::::: FRAME ::::::::::::::::::::::::::::::::::::::::::::::

const area = app.area;

// the lists have a route, the details do not: they render once app.go() opened them,
// and a reload lands on the first list. explore-podcast is opened with a feed url
// rather than an id, a podcast that is not subscribed has no record to point at
app.views = {
  latest            : { route: '/',         view: 'LatestView' },
  episode           : 'EpisodeDetailView',
  podcasts          : { route: '/podcasts', view: 'PodcastsView' },
  podcast           : 'PodcastDetailView',
  saved             : { route: '/saved',    view: 'SavedView' },
  explore           : { route: '/explore',  view: 'ExploreView' },
  'explore-podcast' : 'ExplorePodcastView',
};

app.dialogs = {
  add : 'AddPodcastDialog',
};

// a detail view keeps the item of the list it was opened from
const dockItems = [
  { label: 'Episodes', icon: 'mdi:playlist-play',     view: 'latest'                        },
  { label: 'Podcasts', icon: 'mdi:view-grid-outline', view: 'podcasts'                      },
  { label: 'Later',    icon: 'bookmarks',             view: 'saved'                         },
  { label: 'Explore',  icon: 'mdi:compass-outline',   view: 'explore'                       },
  { label: 'Settings', icon: 'settings',              onClick: () => area('config')?.toggle() },
];

</script>

<>
  <app-area name='main'>
    <rat-views transition-on='glide'>
      <rat-view id='latest' route='/' />
      <rat-view id|route='podcasts'   />
      <rat-view id|route='saved'      />
      <rat-view id|route='explore'    />
    </rat-views>
    
    <PlayerPanel />
    <Dock items={dockItems} />
    <Slot map={app.dialogs} name={RAT.app.$dialog} load='dialog' />
  </app-area>
      
  <app-area name='config' dock='end'>
    <Config><Export /></Config>
  </app-area>
</>

</style>
