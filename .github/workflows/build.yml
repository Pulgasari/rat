name: build docs and apps

# builds dev/docs into docs/ and every app of dev/apps with a build in its config.rat.js into apps/
# (rat build, @rat/dev), as code.pulgasari.dev serves them. one that fails does not stop the others,
# the run fails at the end and names it.
#
# the import map (packages/app/run/importmap.json) points into the repos next to this one, so
# they are checked out side by side (.github/config.js: repos). a change there builds nothing by
# itself: run this by hand (actions -> build docs and apps).
#
# debounced as the css of gestalt: a push waits (.github/config.js: debounce), a newer one cancels
# it. the commit made here uses GITHUB_TOKEN, which starts no new run.

on:
  push:
    branches: [main]
    paths:
      - 'dev/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
      - '.github/config.js'
      - '.github/scripts/**'
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: rat
          ref: ${{ github.ref }}

      - id: config
        run: node rat/.github/scripts/config.mjs >> "$GITHUB_OUTPUT"

      - name: wait for the last change
        if: github.event_name == 'push'
        run: sleep ${{ steps.config.outputs.debounce }}

      - run: node rat/.github/scripts/repos.mjs

      - uses: actions/setup-node@v4
        with: { node-version: '${{ steps.config.outputs.node }}' }

      - name: build
        working-directory: rat
        run: |
          npm ci
          failed=''
          npm run build:docs || failed="$failed docs"
          for app in dev/apps/*/; do
            grep -q '^  build' "$app/config.rat.js" 2>/dev/null || continue
            npx rat build "$app" || failed="$failed $(basename "$app")"
          done
          echo "failed=$failed" >> "$GITHUB_ENV"

      - name: commit
        working-directory: rat
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs apps
          git diff --cached --quiet || {
            git commit -m 'docs, apps: rebuild'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          }
          if [ -n "$failed" ]; then echo "::error::did not build:$failed"; exit 1; fi
