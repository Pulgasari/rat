name: build docs and apps

# builds dev/docs into docs/ and every app of dev/apps with a build in its config.rat.js into apps/
# (rat build, @rat/dev), as code.pulgasari.dev serves them. one that fails does not stop the others,
# the run fails at the end and names it.
#
# the import map (packages/app/run/importmap.json) points into the repos next to this one, so
# they are checked out side by side: rat/, aufbau/, bunker/, domina/, gestalt/, htx/, js-packages/.
# a change there builds nothing by itself: run this by hand (actions -> build docs and apps).
#
# debounced as the css of gestalt: a push waits 7 minutes, a newer one cancels it. the commit
# made here uses GITHUB_TOKEN, which starts no new run.

on:
  push:
    branches: [main]
    paths:
      - 'dev/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: wait for the last change
        if: github.event_name == 'push'
        run: sleep 420

      - uses: actions/checkout@v4
        with:
          path: rat
          ref: ${{ github.ref }}

      - { uses: actions/checkout@v4, with: { path: aufbau,      repository: Pulgasari/aufbau      } }
      - { uses: actions/checkout@v4, with: { path: bunker,      repository: Pulgasari/bunker      } }
      - { uses: actions/checkout@v4, with: { path: domina,      repository: Pulgasari/domina      } }
      - { uses: actions/checkout@v4, with: { path: gestalt,     repository: Pulgasari/gestalt     } }
      - { uses: actions/checkout@v4, with: { path: htx,         repository: Pulgasari/htx         } }
      - { uses: actions/checkout@v4, with: { path: js-packages, repository: Pulgasari/js-packages } }

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: build
        working-directory: rat
        run: |
          npm ci
          failed=''
          npm run build:docs || failed="$failed docs"
          for app in dev/apps/*/; do
            grep -q '^  build' "$app/config.rat.js" 2>/dev/null || continue
            npx rat build "$app" || failed="$failed $(basename "$app")"
          done
          echo "failed=$failed" >> "$GITHUB_ENV"

      - name: commit
        working-directory: rat
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs apps
          git diff --cached --quiet || {
            git commit -m 'docs, apps: rebuild'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          }
          if [ -n "$failed" ]; then echo "::error::did not build:$failed"; exit 1; fi
