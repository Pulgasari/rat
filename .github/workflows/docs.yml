name: build docs

# builds dev/docs into docs/ (npm run build:docs, @rat/dev), as code.pulgasari.dev serves it.
#
# the import map (packages/app/run/importmap.json) points into the repos next to this one, so
# they are checked out side by side: rat/, aufbau/, bunker/, domina/, gestalt/, htx/, js-packages/.
# a change there builds nothing by itself: run this by hand (actions -> build docs).
#
# debounced as the css of gestalt: a push waits 7 minutes, a newer one cancels it. the commit
# made here uses GITHUB_TOKEN, which starts no new run.

on:
  push:
    branches: [main]
    paths:
      - 'dev/docs/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: wait for the last change
        if: github.event_name == 'push'
        run: sleep 420

      - uses: actions/checkout@v4
        with:
          path: rat
          ref: ${{ github.ref }}

      - { uses: actions/checkout@v4, with: { path: aufbau,      repository: Pulgasari/aufbau      } }
      - { uses: actions/checkout@v4, with: { path: bunker,      repository: Pulgasari/bunker      } }
      - { uses: actions/checkout@v4, with: { path: domina,      repository: Pulgasari/domina      } }
      - { uses: actions/checkout@v4, with: { path: gestalt,     repository: Pulgasari/gestalt     } }
      - { uses: actions/checkout@v4, with: { path: htx,         repository: Pulgasari/htx         } }
      - { uses: actions/checkout@v4, with: { path: js-packages, repository: Pulgasari/js-packages } }

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: build
        working-directory: rat
        run: |
          npm ci
          npm run build:docs

      - name: commit
        working-directory: rat
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs
          git diff --cached --quiet && exit 0
          git commit -m 'docs: rebuild'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
